[package]
name = "bettertest-package"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bettertest-crate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "multipart", "tokio"] }
axum_typed_multipart = { version = "0.16.7", default-features = false }
bettertest-shared-package = { version = "0.1.0", path = "../shared" }
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }

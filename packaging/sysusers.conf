# The user the services run as. The worker needs docker for tasks with an image and kvm for fast
# vms. The docker group is declared here so it exists, and rpm counts it as provided, even before
# docker is installed; docker's package then reuses it. kvm always exists (systemd/udev, setup).
g docker -
u bettertest - "bettertest" /var/lib/bettertest
m bettertest docker
m bettertest kvm

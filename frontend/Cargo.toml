[package]
name = "bettertest-frontend"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ivhacks/bettertest"

[[bin]]
name = "bettertest-frontend"
path = "src/main.rs"

[dependencies]
bettertest-shared = { path = "../shared" }
futures = "0.3"
gloo = { version = "0.12", features = ["futures"] }
gloo-net = { version = "0.7", features = ["json"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomTokenList", "Element", "Event", "FontFaceSet", "History", "HtmlCollection", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "MouseEvent", "Node", "NodeList", "Performance", "Url"] }
yew = { version = "0.23", features = ["csr"] }

[dev-dependencies]
uuid = "1"

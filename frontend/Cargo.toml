[package]
name = "bettertest-frontend"
# Not the product's version (core/Cargo.toml's is). wasm-bindgen names the directory of the JS
# snippets (inline_js) after the crate's name and version, not their code: 0.2.1 moved them off the
# URL that browsers had kept as immutable while it served two different inline0.js.
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ivhacks/bettertest"

[[bin]]
name = "bettertest-frontend"
path = "src/main.rs"

[dependencies]
bettertest-shared = { path = "../shared" }
futures = "0.3"
gloo = { version = "0.12", features = ["futures"] }
gloo-net = { version = "0.7", features = ["json"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "DomTokenList", "Element", "Event", "FontFaceSet", "History", "HtmlAnchorElement", "HtmlCollection", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "MouseEvent", "NodeList", "Performance"] }
yew = { version = "0.23", features = ["csr"] }

[dev-dependencies]
uuid = "1"

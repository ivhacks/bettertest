[package]
name = "bettertest-frontend-package"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bettertest-frontend-crate"
path = "src/main.rs"

[dependencies]
bettertest-shared-package = { path = "../shared" }
gloo = { version = "0.12", default-features = false, features = ["net", "console"] }
# gloo's net feature doesn't turn on json; same package, feature-unified with gloo
gloo-net = { version = "0.7", features = ["json"] }
wasm-bindgen-futures = "0.4"
yew = { version = "0.23.0", features = ["csr"] }

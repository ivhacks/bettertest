[package]
name = "bettertest-frontend-package"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bettertest-frontend-crate"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = ["Window", "Document", "HtmlElement", "Text"] }

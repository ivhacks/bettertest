<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>bettertest</title>
  <!-- Enough to paint the name before the stylesheet arrives. The real sheet overrides it, and
       stays a separate cached file so a later visit does not re-download it inside this page. -->
  <style>html,body{margin:0;background:#000;color:#fff}body{font:18px/1.4 system-ui,sans-serif}@media (prefers-color-scheme:light){html,body{background:#fff;color:#000}}</style>
  <!-- Copied as they are, without a content hash, yet served as immutable: a changed asset needs
       a new name (bump its .vN). The fonts' OFL licenses travel with them. -->
  <link data-trunk rel="copy-dir" href="assets" />
  <link rel="icon" href="/assets/favicon.v1.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.v1.png" type="image/png" sizes="32x32" />
  <link rel="preload" href="/assets/archivo.v1.woff2" as="font" type="font/woff2" crossorigin />
  <link data-trunk rel="css" href="style.css" />
  <script src="/assets/plotly.v1.min.js"></script>
  <script>
    function renderViews() {
      document.querySelectorAll('.plotly-view:not([data-rendered])').forEach(function(el) {
        el.setAttribute('data-rendered', 'true');
        var url = el.getAttribute('data-url');
        if (!url) return;
        fetch(url)
          .then(function(r) { return r.json(); })
          .then(function(spec) {
            var layout = spec.layout || {};
            layout.paper_bgcolor = '#000';
            layout.plot_bgcolor = '#000';
            layout.font = layout.font || {};
            layout.font.family = 'Archivo, sans-serif';
            layout.font.color = '#fff';
            if (layout.xaxis) {
              layout.xaxis.gridcolor = '#333';
              layout.xaxis.color = '#fff';
            }
            if (layout.yaxis) {
              layout.yaxis.gridcolor = '#333';
              layout.yaxis.color = '#fff';
            }
            var config = { responsive: true, displayModeBar: false };
            Plotly.newPlot(el, spec.data, layout, config);
          })
          .catch(function(e) {
            el.textContent = 'Failed to load view: ' + e.message;
          });
      });
    }
    var observer = new MutationObserver(renderViews);
    observer.observe(document.body, { childList: true, subtree: true });
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderViews);
    } else {
      renderViews();
    }
  </script>
</head>
<body>bettertest</body>
</html>

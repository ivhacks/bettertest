<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>bettertest</title>
  <!-- Enough to paint the name before the stylesheet arrives. The real sheet overrides it, and
       stays a separate cached file so a later visit does not re-download it inside this page. -->
  <style>html,body{margin:0;background:#000;color:#fff}body{font:18px/1.4 system-ui,sans-serif}@media (prefers-color-scheme:light){html,body{background:#fff;color:#000}}</style>
  <!-- Copied as they are, without a content hash, yet served as immutable: a changed asset needs
       a new name (bump its .vN). The fonts' OFL licenses travel with them. -->
  <link data-trunk rel="copy-dir" href="assets" />
  <link rel="icon" href="/assets/favicon.v1.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32.v1.png" type="image/png" sizes="32x32" />
  <link rel="preload" href="/assets/archivo.v1.woff2" as="font" type="font/woff2" crossorigin />
  <link data-trunk rel="css" href="style.css" />
  <!-- The page stays blank until the app draws it. A browser that cannot start the app says why,
       on the page and in the boss's log, instead of staying blank. -->
  <script>
    addEventListener("error", (e) => failed(`${e.message} at ${e.filename}:${e.lineno}`));
    addEventListener("unhandledrejection", (e) => failed(String(e.reason?.stack || e.reason)));
    setTimeout(() => {
      const fetched = performance.getEntriesByType("resource").map((r) => r.name.split("/").pop());
      failed(`not started after 20 s; fetched: ${fetched.join(" ")}`);
    }, 20000);
    function failed(why) {
      if (document.body.hasAttribute("data-started") || document.body.hasAttribute("data-failed")) return;
      document.body.setAttribute("data-failed", "");
      document.body.textContent = `bettertest could not start: ${why}`;
      navigator.sendBeacon("/api/startup-error", why);
    }
  </script>
</head>
<body></body>
</html>
